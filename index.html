<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Deteksi Plat Nomor</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#05070d">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #05070d;
    --panel: rgba(9, 15, 26, 0.78);
    --cyan: #00f0ff;
    --amber: #ff7a1a;
    --green: #39ff88;
    --yellow: #ffe066;
    --red: #ff3b5c;
    --text: #d9f4ff;
    --muted: #6b8394;
    --font-display: 'Orbitron', sans-serif;
    --font-mono: 'Share Tech Mono', monospace;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html, body{
    margin:0; padding:0; height:100%; overflow:hidden;
    background:var(--bg); color:var(--text);
    font-family: var(--font-mono);
  }
  #app{ position:fixed; inset:0; display:flex; flex-direction:column; }
  #camera-wrap{ position:relative; flex:1; overflow:hidden; background:#000; }
  video, canvas#overlay{ position:absolute; top:0; left:0; width:100%; height:100%; object-fit:cover; }
  #overlay{ pointer-events:none; }
  #preview-img{
    position:absolute; top:0; left:0; width:100%; height:100%; object-fit:contain;
    background:#000; display:none; z-index:3;
  }

  #grid-fx{
    position:absolute; inset:0; z-index:2; pointer-events:none;
    background-image:
      linear-gradient(rgba(0,240,255,0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,240,255,0.06) 1px, transparent 1px);
    background-size: 34px 34px; mix-blend-mode: screen;
  }

  /* Bracket fokus buat area plat */
  #plate-guide{
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    width:78%; max-width:340px; aspect-ratio: 4.6/1; z-index:5; pointer-events:none;
  }
  .pg-corner{
    position:absolute; width:22px; height:22px;
    border:2.5px solid var(--amber);
    filter: drop-shadow(0 0 4px var(--amber));
  }
  .pg-corner.tl{ top:0; left:0; border-right:none; border-bottom:none; }
  .pg-corner.tr{ top:0; right:0; border-left:none; border-bottom:none; }
  .pg-corner.bl{ bottom:0; left:0; border-right:none; border-top:none; }
  .pg-corner.br{ bottom:0; right:0; border-left:none; border-top:none; }
  #plate-guide .hint{
    position:absolute; bottom:-22px; left:0; right:0; text-align:center;
    font-size:9.5px; color:var(--amber); letter-spacing:0.5px; text-transform:uppercase;
  }

  #topbar{
    position:absolute; top:0; left:0; right:0; z-index:6;
    display:flex; justify-content:space-between; align-items:center;
    padding: max(10px, env(safe-area-inset-top)) 14px 8px 14px;
    background: linear-gradient(to bottom, rgba(2,4,9,0.9), transparent);
  }
  #brand{
    font-family: var(--font-display); font-size:12px; font-weight:800;
    letter-spacing:1.5px; text-transform:uppercase;
    display:flex; align-items:center; gap:6px;
    color:var(--amber); text-shadow: 0 0 10px rgba(255,122,26,0.5);
  }
  #brand .dot{
    width:7px; height:7px; border-radius:50%; background:var(--green);
    box-shadow:0 0 8px var(--green); animation: pulse-dot 1.6s ease-in-out infinite;
  }
  @keyframes pulse-dot{ 0%,100%{opacity:1;} 50%{opacity:0.35;} }
  #status-pill{
    font-family: var(--font-mono); font-size:10px; letter-spacing:0.5px; text-transform:uppercase;
    padding:4px 9px; background:rgba(255,255,255,0.05); color:var(--muted);
    border:1px solid rgba(255,255,255,0.15);
    clip-path: polygon(6px 0, 100% 0, 100% 100%, 0 100%, 0 6px);
  }
  #status-pill.ready{ color:var(--green); border-color:rgba(57,255,136,0.4); background:rgba(57,255,136,0.08); }
  #status-pill.busy{ color:var(--yellow); border-color:rgba(255,224,102,0.4); background:rgba(255,224,102,0.08); }
  #status-pill.error{ color:var(--red); border-color:rgba(255,59,92,0.4); background:rgba(255,59,92,0.08); }

  /* Panel hasil */
  #result-panel{
    position:absolute; bottom:78px; left:12px; right:12px; z-index:6;
    background:var(--panel); backdrop-filter: blur(8px);
    border:1px solid rgba(255,122,26,0.25);
    clip-path: polygon(10px 0, 100% 0, 100% 100%, 0 100%, 0 10px);
    padding:12px 14px;
    display:none;
  }
  #result-panel.show{ display:block; }
  #result-panel .rlbl{ font-size:9px; color:var(--muted); text-transform:uppercase; letter-spacing:1px; }
  #result-panel .rplate{
    font-family: var(--font-display); font-size:22px; font-weight:800;
    color:var(--amber); letter-spacing:2px; margin-top:4px;
    text-shadow:0 0 10px rgba(255,122,26,0.5);
  }
  #result-panel .rconf{ font-size:10px; color:var(--muted); margin-top:4px; }
  #result-panel .rraw{ font-size:9.5px; color:var(--muted); margin-top:6px; word-break:break-all; }

  #bottombar{
    position:absolute; bottom:52px; left:0; right:0; z-index:6;
    display:flex; align-items:center; justify-content:center; gap:10px;
    padding: 12px 16px 10px 16px;
    background: linear-gradient(to top, rgba(2,4,9,0.9), transparent);
  }
  .btn{
    border:none; padding:12px 14px;
    font-family: var(--font-mono); font-size:11px; font-weight:700; letter-spacing:0.3px; text-transform:uppercase;
    display:flex; align-items:center; gap:5px; color:var(--text);
    background:rgba(255,255,255,0.06); border:1px solid rgba(255,122,26,0.3);
    clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
    white-space:nowrap;
  }
  .btn:active{ transform:scale(0.96); }
  #btn-scan{
    background:var(--amber); color:#1a0d02; padding:14px 26px; font-size:13px; font-weight:800;
    box-shadow:0 0 16px rgba(255,122,26,0.35);
  }
  #btn-scan.busy{ background:var(--yellow); }
  #btn-upload{ font-size:15px; padding:12px 14px; }
  #btn-retry{ font-size:10.5px; padding:12px 12px; display:none; }
  #btn-retry.show{ display:flex; }

  /* Tab bar bawah (Scan / Data) */
  #tabbar{
    position:fixed; bottom:0; left:0; right:0; z-index:10;
    display:flex;
    background:#0a0e18; border-top:1px solid rgba(255,122,26,0.25);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .tab-btn{
    flex:1; border:none; background:transparent; color:var(--muted);
    font-family: var(--font-mono); font-size:11px; font-weight:700; text-transform:uppercase;
    padding:13px 6px; letter-spacing:0.3px;
  }
  .tab-btn.active{ color:var(--amber); text-shadow:0 0 6px rgba(255,122,26,0.4); border-top:2px solid var(--amber); }

  /* Halaman Kelola Data */
  #data-view{
    position:fixed; inset:0 0 52px 0; z-index:8;
    background:var(--bg); overflow-y:auto;
    display:none; padding:0 14px 20px 14px;
  }
  #data-view.show{ display:block; }
  #data-topbar{
    padding: max(14px, env(safe-area-inset-top)) 0 12px 0;
    font-family:var(--font-display); font-size:13px; font-weight:800;
    color:var(--amber); letter-spacing:1px;
  }
  #data-form{ display:flex; flex-direction:column; gap:8px; margin-bottom:16px; }
  #data-form input{
    background:rgba(255,255,255,0.05); border:1px solid rgba(255,122,26,0.25);
    color:var(--text); padding:11px 12px; font-family:var(--font-mono); font-size:13px;
    clip-path: polygon(6px 0, 100% 0, 100% 100%, 0 100%, 0 6px);
  }
  #data-form input::placeholder{ color:var(--muted); }
  #btn-tambah-data{ justify-content:center; padding:12px; font-size:11.5px; }

  .data-item{
    background:var(--panel); border:1px solid rgba(255,122,26,0.15);
    padding:10px 12px; margin-bottom:8px;
    clip-path: polygon(6px 0, 100% 0, 100% 100%, 0 100%, 0 6px);
    display:flex; justify-content:space-between; align-items:center; gap:8px;
  }
  .data-item .di-info{ flex:1; }
  .data-item .di-plat{ font-family:var(--font-display); font-size:14px; color:var(--amber); font-weight:800; letter-spacing:1px; }
  .data-item .di-nama{ font-size:11.5px; color:var(--text); margin-top:2px; }
  .data-item .di-nim{ font-size:10px; color:var(--muted); margin-top:1px; }
  .data-item .di-delete{
    background:rgba(255,59,92,0.15); border:1px solid rgba(255,59,92,0.4); color:var(--red);
    padding:7px 10px; font-size:10px; font-family:var(--font-mono); font-weight:700;
  }
  #data-empty{ text-align:center; color:var(--muted); font-size:12px; padding:30px 10px; }

  /* Badge terdaftar/tidak di panel hasil scan */
  #match-badge{
    display:inline-block; font-size:10px; font-weight:800; letter-spacing:0.5px;
    padding:3px 9px; margin-top:8px; text-transform:uppercase;
    clip-path: polygon(5px 0, 100% 0, 100% 100%, 0 100%, 0 5px);
  }
  #match-badge.terdaftar{ background:rgba(57,255,136,0.15); color:var(--green); border:1px solid rgba(57,255,136,0.4); }
  #match-badge.tidak{ background:rgba(255,59,92,0.15); color:var(--red); border:1px solid rgba(255,59,92,0.4); }
  #match-info{ font-size:11.5px; color:var(--text); margin-top:6px; line-height:1.5; }

  #file-input{ display:none; }

  #loading{
    position:absolute; inset:0; z-index:20;
    background: radial-gradient(ellipse at 50% 40%, rgba(255,122,26,0.08), transparent 60%), var(--bg);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:16px; text-align:center; padding:30px;
  }
  #loading .spinner{
    width:46px; height:46px; border:2px solid rgba(255,122,26,0.15); border-top-color:var(--amber);
    border-radius:50%; box-shadow:0 0 16px rgba(255,122,26,0.25); animation:spin 0.9s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  #loading h1{
    font-family:var(--font-display); font-size:13px; margin:0; letter-spacing:1.5px; text-transform:uppercase;
    color:var(--amber); text-shadow:0 0 10px rgba(255,122,26,0.5);
  }
  #loading p{ font-family:var(--font-mono); font-size:11.5px; color:var(--muted); margin:0; max-width:280px; }
  #loading.hidden{ display:none; }

  #permission-error{
    position:absolute; inset:0; z-index:25; background:rgba(5,7,13,0.97);
    display:none; flex-direction:column; align-items:center; justify-content:center;
    gap:12px; padding:30px; text-align:center;
  }
  #permission-error.show{ display:flex; }
  #permission-error h2{
    font-family:var(--font-display); font-size:14px; margin:0; color:var(--red);
    letter-spacing:1px; text-transform:uppercase;
  }
  #permission-error p{ font-family:var(--font-mono); font-size:12px; color:var(--muted); margin:0; max-width:300px; line-height:1.6; }
</style>
</head>
<body>
<div id="app">

  <div id="loading">
    <div class="spinner"></div>
    <h1>Menyiapkan OCR...</h1>
    <p id="loading-detail">Memuat mesin pembaca teks, butuh internet di awal saja.</p>
  </div>

  <div id="permission-error">
    <h2>Kamera tidak bisa diakses</h2>
    <p>Kamu tetap bisa pakai fitur "Upload Foto" di bawah tanpa perlu izin kamera.</p>
  </div>

  <div id="camera-wrap">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="overlay"></canvas>
    <img id="preview-img" alt="Preview foto">
    <div id="grid-fx"></div>

    <div id="plate-guide">
      <div class="pg-corner tl"></div>
      <div class="pg-corner tr"></div>
      <div class="pg-corner bl"></div>
      <div class="pg-corner br"></div>
      <div class="hint">Posisikan plat di sini</div>
    </div>

    <div id="topbar">
      <div id="brand"><span class="dot"></span> Deteksi Plat</div>
      <div id="status-pill">Memuat...</div>
    </div>

    <div id="result-panel">
      <div class="rlbl">Hasil Terbaca</div>
      <div class="rplate" id="result-plate">-</div>
      <div class="rconf" id="result-conf">-</div>
      <div id="match-badge"></div>
      <div id="match-info"></div>
      <div class="rraw" id="result-raw"></div>
    </div>

    <div id="bottombar">
      <button class="btn" id="btn-upload" title="Upload foto">🖼️</button>
      <button class="btn" id="btn-scan">📷 Scan Plat</button>
      <button class="btn" id="btn-retry">↺ Ulang</button>
    </div>
  </div>

  <!-- ==== TAB: KELOLA DATA ==== -->
  <div id="data-view">
    <div id="data-topbar">
      <div id="data-brand">📋 Kelola Data Kendaraan</div>
    </div>

    <div id="data-form">
      <input type="text" id="input-plat" placeholder="Plat Nomor (misal: L 2104 XS)">
      <input type="text" id="input-nama" placeholder="Nama Pemilik">
      <input type="text" id="input-nim" placeholder="NIM / NIP">
      <button class="btn" id="btn-tambah-data">➕ Tambah Data</button>
    </div>

    <div id="data-list"></div>
  </div>

  <div id="tabbar">
    <button class="tab-btn active" id="tab-scan">🔍 Scan</button>
    <button class="tab-btn" id="tab-data">📋 Data Terdaftar</button>
  </div>

</div>

<input type="file" id="file-input" accept="image/*">
<canvas id="capture-canvas" style="display:none;"></canvas>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.0/dist/tesseract.min.js"></script>
<script src="app.js"></script>
</body>
</html>
